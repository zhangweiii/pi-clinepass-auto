name: Release

# Publishing is tag driven:
#   npm version prerelease --preid=beta && git push --follow-tags   -> v0.2.0-beta.0 -> dist-tag "beta"
#   npm version patch && git push --follow-tags                     -> v0.2.0        -> dist-tag "latest"
# (npm run release:beta / release:stable wrap the common cases.)
#
# Authentication uses npm Trusted Publishing (OIDC) — no tokens:
# on npmjs.com open the package -> Settings -> Trusted publishing and add this
# repository with the workflow filename "release.yml", leaving "npm publish"
# UNCHECKED (npm's recommendation: stage-only).
#
# Because the trust relationship cannot publish directly, this workflow only
# stages the release; a maintainer promotes it with 2FA:
#
#   npm stage list
#   npm stage approve <stage-id> --otp <code>
#
# Trusted publishers can only be configured once a package exists, so the very
# first version is published by hand (see README "Releasing").

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance / Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          # No dependency cache in release builds (npm's own guidance).

      # Trusted Publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify the tag matches package.json
        run: |
          PKG_TAG="v$(node -p "require('./package.json').version")"
          if [ "$PKG_TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($PKG_TAG). Bump the version with 'npm version' instead of tagging by hand."
            exit 1
          fi

      - run: npm run typecheck

      - run: npm test

      - name: Stage the npm release
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [[ "$VERSION" == *-* ]]; then
            echo "Staging prerelease $VERSION with dist-tag beta"
            npm stage publish --tag beta --provenance --access public
          else
            echo "Staging $VERSION with dist-tag latest"
            npm stage publish --tag latest --provenance --access public
          fi

      - name: Approve instructions
        run: |
          {
            echo "### npm release staged — approval required"
            echo
            echo "The trusted publisher is stage-only, so nothing is public yet."
            echo "Promote the staged version with 2FA:"
            echo
            echo '```sh'
            echo "npm stage list"
            echo "npm stage approve <stage-id> --otp <code>"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
